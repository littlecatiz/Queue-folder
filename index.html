<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Tracking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JS-YAML สำหรับแปลงไฟล์ .yml -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Kanit:wght@300;400;500;600&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F6F2ED',
                        coffee: '#DAD1C6',
                        cocoa: '#9C8F7F',
                        folder: '#DAD1C6',
                        folderTab: '#C8BCB0',
                    },
                    fontFamily: {
                        signature: ['"Alex Brush"', 'cursive'],
                        sans: ['Kanit', 'sans-serif'],
                        serif: ['"Libre Baskerville"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .folder-perspective { perspective: 1200px; }

        .folder-flip-enter-active, .folder-flip-leave-active {
            transition: all 0.65s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }
        .folder-cover { transform-origin: left center; }
        .folder-flip-leave-to.folder-cover, .folder-flip-enter-from.folder-cover {
            transform: rotateY(-110deg) scale(0.95);
            opacity: 0;
        }
        .folder-inside { transform-origin: center center; }
        .folder-flip-enter-from.folder-inside, .folder-flip-leave-to.folder-inside {
            transform: scale(0.9) translateY(20px);
            opacity: 0;
        }

        .progress-striped {
            background-image: linear-gradient(
                45deg,
                rgba(246, 242, 237, 0.3) 25%,
                transparent 25%,
                transparent 50%,
                rgba(246, 242, 237, 0.3) 50%,
                rgba(246, 242, 237, 0.3) 75%,
                transparent 75%,
                transparent
            );
            background-size: 0.8rem 0.8rem;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .animate-heartbeat { animation: heartbeat 1.2s infinite ease-in-out; }

        .ticket-item {
            transition: transform 0.25s ease-out, opacity 0.25s ease-out, filter 0.25s ease-out;
            will-change: transform, opacity, filter;
        }
        .ticket-item.is-focused { transform: scale(1); opacity: 1; filter: blur(0px); }
        .ticket-item.is-unfocused { transform: scale(0.82); opacity: 0.22; filter: blur(1.5px); }
    </style>
</head>
<body class="bg-cream text-[#4A3E3D] font-sans min-h-screen flex flex-col justify-center items-center overflow-x-hidden p-3 select-none">

    <div id="app" class="w-full max-w-sm sm:max-w-md min-h-screen flex flex-col justify-center items-center relative folder-perspective">
        
        <!-- ปุ่มไปหน้า Admin Login -->
        <div class="fixed top-3 left-3 z-50">
            <a href="/admin/" class="bg-coffee/50 hover:bg-coffee/80 text-cocoa px-3 py-1 rounded-full text-xs flex items-center gap-1.5 transition border border-white/60 backdrop-blur-sm shadow-sm">
                <i data-lucide="lock" class="w-3 h-3"></i>
                <span>Admin Panel</span>
            </a>
        </div>

        <!-- PAGE 1: หน้าปกแฟ้ม -->
        <transition name="folder-flip">
            <div v-if="currentPage === 1" class="folder-cover absolute w-64 h-80 bg-folder rounded-2xl shadow-2xl p-5 flex flex-col justify-between items-center border border-white/80 z-20">
                <button @click="goToPage(2)" class="absolute -right-2 top-10 bg-folderTab hover:bg-cocoa text-cream font-medium px-3 py-1.5 rounded-r-md shadow-md transform hover:translate-x-0.5 transition flex items-center gap-1 text-xs border-l border-white/30 cursor-pointer z-30">
                    <span class="font-serif italic">Next Page</span>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>

                <i data-lucide="sparkles" class="absolute top-6 left-6 text-cream/80 w-4 h-4"></i>
                <i data-lucide="star" class="absolute top-16 left-12 text-cream/60 w-2.5 h-2.5"></i>
                <i data-lucide="sparkle" class="absolute bottom-8 right-8 text-cream/70 w-3.5 h-3.5"></i>

                <div class="my-auto text-center transform -rotate-6">
                    <h1 class="font-signature text-5xl text-cocoa drop-shadow-sm leading-tight">Queue Folder</h1>
                    <p class="font-serif italic text-[10px] text-cocoa/80 mt-1">Click Next Page to open</p>
                </div>
            </div>
        </transition>

        <!-- PAGE 2: หน้าตั๋วคิว -->
        <transition name="folder-flip">
            <div v-if="currentPage === 2" class="folder-inside w-full flex flex-col items-center py-4 relative z-10">
                <div class="w-full mb-2 flex justify-between items-center px-3">
                    <button @click="goToPage(1)" class="bg-coffee/40 hover:bg-coffee/70 text-cocoa px-2.5 py-1 rounded-full text-xs flex items-center gap-1 transition border border-white/50 cursor-pointer">
                        <i data-lucide="arrow-left" class="w-3 h-3"></i>
                        <span class="font-serif italic">Back to Cover</span>
                    </button>
                </div>

                <div ref="scrollContainer" @scroll="handleScroll" class="w-full h-[420px] overflow-y-auto no-scrollbar py-28 space-y-6 scroll-smooth">
                    <div v-for="(ticket, index) in tickets" :key="ticket.id" :data-index="index" :class="['ticket-item relative mx-auto w-[92%]', getFocusClass(index)]">
                        <div class="bg-[#F8F6F2] border border-coffee rounded-xl shadow-md flex overflow-hidden relative">
                            <div class="flex-1 p-3.5 border-r border-dashed border-cocoa/40 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center text-[10px] text-cocoa mb-0.5">
                                        <span class="font-serif italic">Queue Ticket</span>
                                        <span>{{ ticket.date }}</span>
                                    </div>
                                    <div class="text-xl font-bold text-[#5C4D4D] leading-tight">{{ ticket.queueNumber }}</div>
                                    <div class="text-xs font-medium text-cocoa truncate">ลูกค้า: {{ ticket.customerName }}</div>
                                </div>

                                <div class="mt-2.5">
                                    <div class="flex justify-between text-[10px] font-medium text-cocoa mb-0.5">
                                        <span>{{ getStatusName(ticket.progress) }}</span>
                                        <span>{{ ticket.progress }}%</span>
                                    </div>
                                    <div class="w-full bg-coffee/30 h-2.5 rounded-full overflow-hidden flex items-center p-0.5 relative">
                                        <span class="text-cocoa animate-heartbeat absolute left-0.5 z-10 text-[9px]">🤎</span>
                                        <div class="h-full bg-cocoa rounded-full transition-all duration-300 progress-striped pl-2" :style="{ width: ticket.progress + '%' }"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="w-16 bg-coffee/15 flex items-center justify-center relative overflow-hidden">
                                <div class="transform -rotate-90 whitespace-nowrap flex items-center justify-center">
                                    <svg :id="'barcode-' + ticket.id" class="max-h-8 w-24"></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="fixed bottom-4 bg-cocoa/90 text-cream px-5 py-1.5 rounded-full shadow-lg border border-white/20 text-xs backdrop-blur-md z-30">
                    ขณะนี้มีรายการทั้งหมด <span class="font-bold text-coffee">{{ tickets.length }}</span> คิว
                </div>
            </div>
        </transition>

    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const currentPage = ref(1);
                const focusedIndex = ref(0);
                const scrollContainer = ref(null);
                const tickets = ref([]);

                // ดึงข้อมูลจากไฟล์ data/queues.yml
                const loadYmlData = async () => {
                    try {
                        const response = await fetch('/data/queues.yml');
                        const text = await response.text();
                        const parsed = jsyaml.load(text);
                        tickets.value = parsed.queues || [];
                    } catch (e) {
                        console.error('Error fetching YML:', e);
                    }
                };

                const getStatusName = (prog) => {
                    if (prog <= 0) return 'Waiting in line';
                    if (prog <= 20) return 'Project brief';
                    if (prog <= 40) return 'Waiting for payment';
                    if (prog <= 60) return 'In progress';
                    if (prog <= 80) return 'Check the work';
                    return 'Assignment submitted';
                };

                const generateBarcodes = () => {
                    tickets.value.forEach(t => {
                        try {
                            JsBarcode(`#barcode-${t.id}`, t.queueNumber, {
                                format: "CODE128",
                                displayValue: false,
                                height: 25,
                                margin: 0
                            });
                        } catch(e){}
                    });
                };

                const goToPage = (page) => {
                    currentPage.value = page;
                    nextTick(() => {
                        lucide.createIcons();
                        if (page === 2) {
                            generateBarcodes();
                        }
                    });
                };

                const getFocusClass = (index) => {
                    return index === focusedIndex.value ? 'is-focused' : 'is-unfocused';
                };

                const handleScroll = () => {
                    if (!scrollContainer.value) return;
                    const container = scrollContainer.value;
                    const children = container.querySelectorAll('.ticket-item');
                    const containerCenter = container.getBoundingClientRect().top + container.clientHeight / 2;

                    let minDistance = Infinity;
                    let closestIndex = 0;

                    children.forEach((child, index) => {
                        const childCenter = child.getBoundingClientRect().top + child.clientHeight / 2;
                        const distance = Math.abs(containerCenter - childCenter);
                        if (distance < minDistance) {
                            minDistance = distance;
                            closestIndex = index;
                        }
                    });

                    focusedIndex.value = closestIndex;
                };

                onMounted(() => {
                    loadYmlData();
                    lucide.createIcons();

                    // สแกน Token จากลิงก์คำเชิญอีเมล Netlify Identity
                    if (window.netlifyIdentity) {
                        window.netlifyIdentity.on("init", user => {
                            if (!user) {
                                window.netlifyIdentity.on("login", () => {
                                    document.location.href = "/admin/";
                                });
                            }
                        });
                    }
                });

                return {
                    currentPage,
                    tickets,
                    scrollContainer,
                    goToPage,
                    getStatusName,
                    getFocusClass,
                    handleScroll
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
